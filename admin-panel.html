<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REDZ · Painel de Controle</title>
<style>
  :root {
    --bg: #0a0a0c;
    --bg-panel: #111114;
    --bg-input: #17171b;
    --border: #232328;
    --red: #e0202f;
    --red-dim: #8f1620;
    --red-glow: rgba(224, 32, 47, 0.35);
    --text: #ededf0;
    --sub: #7a7a82;
    --green: #35d17a;
    --amber: #e0a020;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(224,32,47,0.06), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(224,32,47,0.04), transparent 40%);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 24px 16px 64px;
  }

  .wrap { max-width: 920px; margin: 0 auto; }

  /* ---------- HEADER ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: center; gap: 12px; }

  .brand-mark {
    width: 40px; height: 40px;
    border: 1.5px solid var(--red);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono);
    font-weight: 700;
    color: var(--red);
    box-shadow: 0 0 20px var(--red-glow);
    flex-shrink: 0;
  }

  .brand-text h1 {
    font-size: 17px;
    letter-spacing: 0.04em;
    font-weight: 700;
  }
  .brand-text p {
    font-size: 12px;
    color: var(--sub);
    font-family: var(--mono);
    margin-top: 2px;
  }

  .status-pill {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--sub);
    background: var(--bg-panel);
    border: 1px solid var(--border);
    padding: 7px 12px;
    border-radius: 100px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sub); flex-shrink: 0; }
  .dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.offline { background: var(--red); box-shadow: 0 0 8px var(--red); }

  /* ---------- LOGIN GATE ---------- */
  #gate {
    max-width: 380px;
    margin: 12vh auto 0;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
  }
  #gate h2 {
    font-size: 15px;
    margin-bottom: 4px;
    letter-spacing: 0.03em;
  }
  #gate p.hint {
    font-size: 12.5px;
    color: var(--sub);
    margin-bottom: 20px;
    line-height: 1.5;
  }

  /* ---------- PANELS ---------- */
  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--sub);
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel h2::before {
    content: '';
    width: 3px; height: 13px;
    background: var(--red);
    border-radius: 2px;
    display: inline-block;
  }

  /* ---------- FORM ELEMENTS ---------- */
  label {
    display: block;
    font-size: 12px;
    color: var(--sub);
    margin-bottom: 6px;
    font-family: var(--mono);
  }

  input[type="text"], input[type="password"], input[type="number"] {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 13px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--red); }
  input::placeholder { color: #4a4a52; }

  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }

  button {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 13.5px;
    border: none;
    border-radius: 8px;
    padding: 11px 18px;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s, opacity 0.15s;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-primary {
    background: var(--red);
    color: #fff;
    box-shadow: 0 0 0 rgba(224,32,47,0);
  }
  .btn-primary:hover:not(:disabled) { background: #f2384a; }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--sub);
  }
  .btn-ghost:hover:not(:disabled) { border-color: var(--red); color: var(--text); }

  .btn-danger {
    background: transparent;
    border: 1px solid var(--red-dim);
    color: #ff6b76;
  }
  .btn-danger:hover:not(:disabled) { background: var(--red-dim); color: #fff; }

  .btn-small { padding: 6px 12px; font-size: 12px; border-radius: 6px; }

  /* ---------- GENERATED KEY OUTPUT ---------- */
  #genOutput {
    margin-top: 16px;
    display: none;
    background: var(--bg-input);
    border: 1px solid var(--green);
    border-radius: 8px;
    padding: 14px;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  #genOutput code {
    font-family: var(--mono);
    color: var(--green);
    font-size: 14px;
    letter-spacing: 0.02em;
    word-break: break-all;
  }

  /* ---------- KEYS TABLE ---------- */
  .table-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .search-box { flex: 1; min-width: 180px; }

  .keys-list { display: flex; flex-direction: column; gap: 10px; }

  .key-card {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }

  .key-card .kc-main { flex: 1; min-width: 220px; }

  .key-card .kc-code {
    font-family: var(--mono);
    font-size: 13.5px;
    color: var(--text);
    letter-spacing: 0.02em;
    margin-bottom: 6px;
    word-break: break-all;
  }

  .kc-meta {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 11.5px;
    color: var(--sub);
    font-family: var(--mono);
  }
  .kc-meta span { display: flex; align-items: center; gap: 5px; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 3px 9px;
    border-radius: 100px;
    text-transform: uppercase;
  }
  .badge.active { background: rgba(53,209,122,0.12); color: var(--green); border: 1px solid rgba(53,209,122,0.3); }
  .badge.expired { background: rgba(224,160,32,0.12); color: var(--amber); border: 1px solid rgba(224,160,32,0.3); }
  .badge.revoked { background: rgba(224,32,47,0.12); color: #ff6b76; border: 1px solid rgba(224,32,47,0.3); }
  .badge.unbound { background: rgba(122,122,130,0.12); color: var(--sub); border: 1px solid var(--border); }

  .kc-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--sub);
    font-size: 13px;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1a1a1e;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 18px;
    font-size: 13px;
    font-family: var(--mono);
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    z-index: 99;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error { border-color: var(--red); color: #ff6b76; }

  #app { display: none; }

  @media (max-width: 560px) {
    .key-card { flex-direction: column; align-items: flex-start; }
    .kc-actions { width: 100%; justify-content: flex-end; }
  }
</style>
</head>
<body>

<!-- ================= LOGIN GATE ================= -->
<div id="gate">
  <h2>Acesso restrito</h2>
  <p class="hint">Informe a Admin API Key configurada no servidor (variável <code style="color:var(--red)">ADMIN_API_KEY</code>) e a URL do backend.</p>

  <label for="apiUrlInput">URL do servidor</label>
  <input type="text" id="apiUrlInput" placeholder="https://seu-servico.onrender.com" style="margin-bottom:14px" />

  <label for="apiKeyInput">Admin API Key</label>
  <input type="password" id="apiKeyInput" placeholder="••••••••••••••••" style="margin-bottom:18px" />

  <button class="btn-primary" style="width:100%" onclick="attemptLogin()">Entrar</button>
  <p id="gateError" style="color:#ff6b76; font-size:12px; margin-top:10px; font-family:var(--mono); display:none;"></p>
</div>

<!-- ================= APP ================= -->
<div class="wrap" id="app">
  <header>
    <div class="brand">
      <div class="brand-mark">R</div>
      <div class="brand-text">
        <h1>REDZ CONTROL</h1>
        <p id="apiUrlLabel">—</p>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="status-pill"><span class="dot" id="connDot"></span><span id="connLabel">verificando…</span></div>
      <button class="btn-ghost btn-small" onclick="logout()">Sair</button>
    </div>
  </header>

  <!-- GERAR KEY -->
  <section class="panel">
    <h2>Gerar nova key</h2>
    <div class="row">
      <div>
        <label for="daysInput">Duração (dias)</label>
        <input type="number" id="daysInput" value="30" min="1" max="3650" />
      </div>
      <div style="flex:0 0 auto; display:flex; align-items:flex-end;">
        <button class="btn-primary" onclick="generateKey()" id="genBtn">Gerar key</button>
      </div>
    </div>

    <div id="genOutput">
      <code id="genOutputCode"></code>
      <button class="btn-ghost btn-small" onclick="copyGenerated()">Copiar</button>
    </div>
  </section>

  <!-- LISTAGEM -->
  <section class="panel">
    <h2>Keys emitidas</h2>
    <div class="table-toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar por código…" oninput="renderKeys()" />
      </div>
      <button class="btn-ghost btn-small" onclick="fetchKeys()">Atualizar</button>
    </div>
    <div class="keys-list" id="keysList">
      <div class="empty-state">Carregando keys…</div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
  let API_URL = '';
  let ADMIN_KEY = '';
  let allKeys = [];

  // -------- Persistência local apenas de conveniência (sessão do navegador) --------
  function saveSession() {
    sessionStorage.setItem('redz_api_url', API_URL);
    sessionStorage.setItem('redz_admin_key', ADMIN_KEY);
  }
  function loadSession() {
    const url = sessionStorage.getItem('redz_api_url');
    const key = sessionStorage.getItem('redz_admin_key');
    if (url && key) {
      API_URL = url;
      ADMIN_KEY = key;
      return true;
    }
    return false;
  }

  function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast show ' + type;
    setTimeout(() => { toast.className = 'toast ' + type; }, 2800);
  }

  async function apiFetch(path, options = {}) {
    const res = await fetch(API_URL + path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + ADMIN_KEY,
        ...(options.headers || {}),
      },
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.error || ('Erro HTTP ' + res.status));
    }
    return data;
  }

  async function attemptLogin() {
    const url = document.getElementById('apiUrlInput').value.trim().replace(/\/$/, '');
    const key = document.getElementById('apiKeyInput').value.trim();
    const errEl = document.getElementById('gateError');
    errEl.style.display = 'none';

    if (!url || !key) {
      errEl.textContent = 'Preencha a URL e a Admin API Key.';
      errEl.style.display = 'block';
      return;
    }

    API_URL = url;
    ADMIN_KEY = key;

    try {
      await apiFetch('/api/keys');
      saveSession();
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('apiUrlLabel').textContent = API_URL.replace(/^https?:\/\//, '');
      setConnStatus(true);
      fetchKeys();
    } catch (err) {
      errEl.textContent = 'Falha na autenticação: ' + err.message;
      errEl.style.display = 'block';
      setConnStatus(false);
    }
  }

  function logout() {
    sessionStorage.removeItem('redz_api_url');
    sessionStorage.removeItem('redz_admin_key');
    location.reload();
  }

  function setConnStatus(online) {
    const dot = document.getElementById('connDot');
    const label = document.getElementById('connLabel');
    dot.className = 'dot ' + (online ? 'online' : 'offline');
    label.textContent = online ? 'conectado' : 'offline';
  }

  // -------- Gerar Key --------
  async function generateKey() {
    const days = Number(document.getElementById('daysInput').value);
    const btn = document.getElementById('genBtn');

    if (!Number.isFinite(days) || days <= 0) {
      showToast('Informe um número de dias válido.', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Gerando…';

    try {
      const data = await apiFetch('/api/generate-key', {
        method: 'POST',
        body: JSON.stringify({ days }),
      });

      document.getElementById('genOutputCode').textContent = data.key;
      document.getElementById('genOutput').style.display = 'flex';
      showToast('Key gerada com sucesso.', 'success');
      fetchKeys();
    } catch (err) {
      showToast('Erro ao gerar key: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Gerar key';
    }
  }

  function copyGenerated() {
    const code = document.getElementById('genOutputCode').textContent;
    navigator.clipboard.writeText(code)
      .then(() => showToast('Copiado para a área de transferência.', 'success'))
      .catch(() => showToast('Não foi possível copiar.', 'error'));
  }

  function copyKey(code) {
    navigator.clipboard.writeText(code)
      .then(() => showToast('Key copiada.', 'success'))
      .catch(() => showToast('Não foi possível copiar.', 'error'));
  }

  // -------- Listagem --------
  async function fetchKeys() {
    const listEl = document.getElementById('keysList');
    try {
      const data = await apiFetch('/api/keys');
      allKeys = data.keys || [];
      setConnStatus(true);
      renderKeys();
    } catch (err) {
      setConnStatus(false);
      listEl.innerHTML = `<div class="empty-state">Falha ao carregar keys: ${escapeHtml(err.message)}</div>`;
    }
  }

  function keyState(k) {
    if (!k.is_active) return { label: 'revogada', cls: 'revoked' };
    if (new Date(k.expires_at).getTime() <= Date.now()) return { label: 'expirada', cls: 'expired' };
    return { label: 'ativa', cls: 'active' };
  }

  function formatDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderKeys() {
    const listEl = document.getElementById('keysList');
    const search = document.getElementById('searchInput').value.trim().toLowerCase();

    const filtered = allKeys.filter(k => k.key_code.toLowerCase().includes(search));

    if (filtered.length === 0) {
      listEl.innerHTML = '<div class="empty-state">Nenhuma key encontrada.</div>';
      return;
    }

    listEl.innerHTML = filtered.map(k => {
      const state = keyState(k);
      const hwidBadge = k.hwid
        ? `<span>🔒 vinculado</span>`
        : `<span class="badge unbound" style="padding:2px 8px;">não vinculado</span>`;

      return `
        <div class="key-card">
          <div class="kc-main">
            <div class="kc-code">${escapeHtml(k.key_code)}</div>
            <div class="kc-meta">
              <span class="badge ${state.cls}">${state.label}</span>
              ${hwidBadge}
              <span>expira: ${formatDate(k.expires_at)}</span>
              <span>último uso: ${formatDate(k.last_used)}</span>
            </div>
          </div>
          <div class="kc-actions">
            <button class="btn-ghost btn-small" onclick="copyKey('${escapeJs(k.key_code)}')">Copiar</button>
            ${k.hwid ? `<button class="btn-ghost btn-small" onclick="resetHwid('${k.id}')">Resetar HWID</button>` : ''}
            ${k.is_active ? `<button class="btn-danger btn-small" onclick="revokeKey('${k.id}')">Revogar</button>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  function escapeJs(str) {
    return String(str).replace(/'/g, "\\'");
  }

  async function revokeKey(id) {
    if (!confirm('Revogar esta key? Esta ação impede novas validações imediatamente.')) return;
    try {
      await apiFetch('/api/revoke-key', { method: 'POST', body: JSON.stringify({ id }) });
      showToast('Key revogada.', 'success');
      fetchKeys();
    } catch (err) {
      showToast('Erro ao revogar: ' + err.message, 'error');
    }
  }

  async function resetHwid(id) {
    if (!confirm('Resetar o HWID vinculado? O cliente poderá vincular a key a um novo dispositivo.')) return;
    try {
      await apiFetch('/api/reset-hwid', { method: 'POST', body: JSON.stringify({ id }) });
      showToast('HWID resetado.', 'success');
      fetchKeys();
    } catch (err) {
      showToast('Erro ao resetar HWID: ' + err.message, 'error');
    }
  }

  // -------- Init --------
  (function init() {
    if (loadSession()) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('apiUrlLabel').textContent = API_URL.replace(/^https?:\/\//, '');
      fetchKeys();
    }
  })();

  // Enter no campo de senha do gate
  document.getElementById('apiKeyInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') attemptLogin();
  });
</script>
</body>
</html>
